name: Fix science runner once

on:
  push:
    branches:
      - feat/papers-scientific-bundle-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/papers-scientific-bundle-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Remove test-only import from normal build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/paper_science.rs')
          s = p.read_text()
          old = 'use std::path::{Path, PathBuf};'
          assert old in s
          s = s.replace(old, 'use std::path::Path;', 1)
          s = s.replace('PathBuf::from("/opt/papers/bin/papers-contract")', 'std::path::PathBuf::from("/opt/papers/bin/papers-contract")', 1)
          p.write_text(s)
          PY
          cargo fmt -- src/paper_science.rs
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/paper_science.rs
          git commit -m 'fix(papers): keep PathBuf test-only'
          git push origin HEAD:feat/papers-scientific-bundle-v1
