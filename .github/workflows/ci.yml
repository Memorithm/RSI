name: CI

# P1.2 TEMPORARY ONE-SHOT: add the single transitive lock edge identified by
# the full Cargo resolver, commit it to the PR branch, then remove this helper.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rsi-p12-lock-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  check:
    name: build · test · clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Add exact num-traits libm lock edge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Cargo.lock")
          s = p.read_text()
          old = '''[[package]]
          name = "num-traits"
          version = "0.2.19"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "071dfc062690e90b734c0b2273ce72ad0ffa95f0c74596bc250dcfd960262841"
          dependencies = [
           "autocfg",
          ]
          '''
          new = '''[[package]]
          name = "num-traits"
          version = "0.2.19"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "071dfc062690e90b734c0b2273ce72ad0ffa95f0c74596bc250dcfd960262841"
          dependencies = [
           "autocfg",
           "libm",
          ]
          '''
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif new not in s:
              raise SystemExit("unexpected num-traits lock block")
          PY
          git diff --check
          git diff -- Cargo.lock

      - name: Commit exact lock completion
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already complete"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: complete canonical SciRust RSI lock graph"
          git push origin HEAD:${{ github.head_ref }}
