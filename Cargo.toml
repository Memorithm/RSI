[package]
name = "rsi"
version = "0.10.0"
edition = "2021"
description = "Recursive Self-Improvement — implémentation Rust du système géométrique unifié (v9)"
# Double licence (cf. LICENSING.md) : gratuit en usage non commercial sous
# PolyForm-Noncommercial-1.0.0, licence commerciale séparée sinon. L'expression
# SPDX « A OR B » reflète le choix laissé à l'utilisateur (LicenseRef pour la
# licence commerciale, hors liste SPDX standard).
license = "PolyForm-Noncommercial-1.0.0 OR LicenseRef-Commercial"
authors = ["Tarek Zekriti / Memorithm"]
repository = "https://github.com/Memorithm/RSI"
homepage = "https://github.com/Memorithm/RSI"
documentation = "https://github.com/Memorithm/RSI/tree/main/docs"
readme = "README.md"
keywords = ["rsi", "self-improvement", "optimization", "agent", "llm"]
categories = ["science", "simulation"]

# Workspace : le crate principal + les backends réels embarqués localement.
# `scirust-rsi` n'est plus dupliqué ici : SciRust en est l'unique propriétaire
# canonique et RSI le consomme à une révision git immuable (voir dépendances).
# COGNO-1 : `cogno-core` (oracle scalaire indépendant) et `cogno-scirust`
# (backend tensoriel/batch validé contre l'oracle).
[workspace]
members = ["forge", "octasoma", "ccos", "crates/cogno-core", "crates/cogno-scirust"]
resolver = "2"

[[bin]]
name = "rsi-full"
path = "src/bin/rsi_full.rs"
required-features = ["forge", "octasoma", "ccos"]

[lib]
name = "rsi"
path = "src/lib.rs"

# Le cœur RSI conserve des dépendances minimales ; COGNO scalar reste lui-même
# std-only et indépendant de tout backend tensoriel.
[features]
default = []
forge = ["dep:forge-core", "dep:rand", "dep:serde"]
octasoma = ["dep:octasoma"]
ccos = ["dep:ccos"]
scirust = ["dep:scirust-rsi", "dep:rand"]
llm-ollama = []
llm-claude = []
llm-claude-ureq = ["llm-claude", "dep:ureq"]
wasm = ["dep:wasmi", "dep:wat"]
observability = ["dep:tracing"]
simd = ["dep:wide"]
web = ["dep:reqwest"]

[dependencies]
cogno-core = { path = "crates/cogno-core" }
forge-core = { path = "forge", optional = true }
octasoma = { path = "octasoma", optional = true }
ccos = { path = "ccos", optional = true }
rand = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
scirust-rsi = { git = "https://github.com/Memorithm/scirust", rev = "8af0801b8bc0c69630797db82bb2dd3416cc8f0a", optional = true }
ureq = { version = "2", optional = true }
wasmi = { version = "0.31", optional = true }
wat = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
wide = { version = "0.7", optional = true }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false, optional = true }

[[bin]]
name = "rsi-demo"
path = "src/main.rs"

[[bin]]
name = "rsi-mcp"
path = "src/bin/rsi_mcp.rs"

[[bin]]
name = "rsi-connect"
path = "src/bin/rsi_connect.rs"

[[bin]]
name = "rsi-ablate"
path = "src/bin/rsi_ablate.rs"

[[bin]]
name = "rsi-loopbench"
path = "src/bin/rsi_loopbench.rs"

[[bin]]
name = "rsi-refine"
path = "src/bin/rsi_refine.rs"

[[bin]]
name = "rsi-dgm"
path = "src/bin/rsi_dgm.rs"
required-features = ["llm-ollama"]

[[bin]]
name = "rsi-scholar"
path = "src/bin/rsi_scholar.rs"
required-features = ["llm-ollama"]

[[bin]]
name = "rsi-simcal"
path = "src/bin/rsi_simcal.rs"
required-features = ["llm-ollama"]

[[bin]]
name = "rsi-ascend"
path = "src/bin/rsi_ascend.rs"
required-features = ["llm-ollama"]

[[bin]]
name = "rsi-crawl"
path = "src/bin/rsi_crawl.rs"

[profile.release]
opt-level = 3
lto = true