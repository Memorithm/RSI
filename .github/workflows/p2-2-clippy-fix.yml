name: P2.2 clippy correction
on:
  push:
    branches: [rsi/p2-2-patchset-envelope-trajectories]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rsi/p2-2-patchset-envelope-trajectories
      - name: Apply clippy diagnostic and retire bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/engineering_proposal.rs')
          s = p.read_text()
          old = '''touched = touched.checked_add(cost).ok_or_else(|| {
                ProposalError::TouchedByteBudgetExceeded {
                    actual: u64::MAX,
                    limit: self.max_touched_bytes,
                }
            })?;'''
          new = '''touched = touched.checked_add(cost).ok_or(
                ProposalError::TouchedByteBudgetExceeded {
                    actual: u64::MAX,
                    limit: self.max_touched_bytes,
                },
            )?;'''
          if s.count(old) != 1:
              raise SystemExit('expected clippy marker not found exactly once')
          p.write_text(s.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p2-2-clippy-fix.yml
          git add src/engineering_proposal.rs
          git diff --cached --check
          git commit -m "style: satisfy P2.2 clippy gate"
          git push origin HEAD:rsi/p2-2-patchset-envelope-trajectories
