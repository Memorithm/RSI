name: CI

# P1.2 TEMPORARY RESOLUTION PROBE. This head exists only to identify the exact
# Cargo.lock completion required by the canonical SciRust dependency. It is
# removed before the final merge gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  PUBLIC_FEATURES: "wasm observability simd llm-ollama llm-claude-ureq scirust"

jobs:
  check:
    name: build · test · clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain Rust stable (+ clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Auth deps git Memorithm (filet — si DEPS_TOKEN présent)
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          if [ -n "$DEPS_TOKEN" ]; then
            git config --global \
              url."https://x-access-token:${DEPS_TOKEN}@github.com/Memorithm/".insteadOf \
              "https://github.com/Memorithm/"
          fi

      - name: Upload committed P1.2 lock
        uses: actions/upload-artifact@v4
        with:
          name: p1-2-lock-before-full-resolution
          path: Cargo.lock
          if-no-files-found: error

      - name: Resolve exact full workspace graph
        run: cargo metadata --format-version 1 >/dev/null

      - name: Show required lock completion
        run: git diff -- Cargo.lock

      - name: Upload fully resolved P1.2 lock
        uses: actions/upload-artifact@v4
        with:
          name: p1-2-lock-after-full-resolution
          path: Cargo.lock
          if-no-files-found: error

      # Keep a compile signal in this probe, but the authoritative gate is the
      # later read-only --locked head after the resolved lock is committed.
      - name: Clippy probe (défaut)
        run: cargo clippy --all-targets --locked -- -D warnings
