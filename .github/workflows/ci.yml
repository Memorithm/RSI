name: CI

# Build + tests + clippy à chaque push sur main et chaque pull request.
# Garde-fou anti-régression : c'est précisément l'absence de CI qui a laissé une
# fusion de branche périmée casser `main` sans alerte. Le seuil de qualité du
# projet est « clippy 0 warning » (cf. docs/SAFETY.md §7) — on l'impose ici via
# `-D warnings`. Pas de garde `rustfmt` : le dépôt suit un formatage manuel
# assumé, le seuil dur est clippy + tests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # `scirust` fait partie des features publiques : P1.2 exige que le bridge RSI
  # compile et soit testé contre la révision SciRust canonique épinglée.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  PUBLIC_FEATURES: "wasm observability simd llm-ollama llm-claude-ureq scirust"

jobs:
  check:
    name: build · test · clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain Rust stable (+ clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Auth deps git Memorithm (filet — si DEPS_TOKEN présent)
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          if [ -n "$DEPS_TOKEN" ]; then
            git config --global \
              url."https://x-access-token:${DEPS_TOKEN}@github.com/Memorithm/".insteadOf \
              "https://github.com/Memorithm/"
            echo "auth Memorithm configurée (fetch privé activé)"
          else
            echo "DEPS_TOKEN absent — les dépôts Memorithm sont publics (nominal)"
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # P1.2 probe only. Export both the committed baseline lock and Cargo's
      # generated result so the final commit can preserve unrelated versions.
      - name: Upload P1.2 baseline Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: p1-2-cargo-lock-baseline
          path: Cargo.lock
          if-no-files-found: error

      - name: P1.2 generate canonical lockfile
        run: cargo generate-lockfile

      - name: Upload P1.2 generated Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: p1-2-cargo-lock-generated
          path: Cargo.lock
          if-no-files-found: error

      - name: Clippy (défaut) — 0 warning
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests (défaut, + doctests)
        run: cargo test --locked

      - name: Clippy (features publiques) — 0 warning
        run: cargo clippy --all-targets --locked --features "$PUBLIC_FEATURES" -- -D warnings

      - name: Tests (features publiques)
        run: cargo test --locked --features "$PUBLIC_FEATURES"
