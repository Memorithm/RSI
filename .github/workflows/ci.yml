name: CI

# Build + tests + clippy à chaque push sur main et chaque pull request.
# Garde-fou anti-régression : c'est précisément l'absence de CI qui a laissé une
# fusion de branche périmée casser `main` sans alerte. Le seuil de qualité du
# projet est « clippy 0 warning » (cf. docs/SAFETY.md §7) — on l'impose ici via
# `-D warnings`. Pas de garde `rustfmt` : le dépôt suit un formatage manuel
# assumé, le seuil dur est clippy + tests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Relance manuelle (onglet Actions → Run workflow) : utile quand l'échec
  # venait d'un état externe (dépôt de dépendance inaccessible, réécrit…).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Les features testées ici sont std-only / crates publiques. MAIS cargo RÉSOUT
  # tout le graphe — y compris les deps git optionnelles `forge/octasoma/ccos/
  # scirust` (dépôts Memorithm, PUBLICS) NON activées : il clone chaque git-dep
  # pour en lire le manifeste, même sous `--locked` et même sans la feature. Si
  # l'un de ces dépôts devient privé/inaccessible (HTTP 401) ou perd sa révision
  # épinglée (force-push), TOUTE la CI casse dès le premier `cargo`. Deux parades :
  #   1. `CARGO_NET_GIT_FETCH_WITH_CLI=true` + un secret `DEPS_TOKEN` (PAT en
  #      lecture) si l'un de ces dépôts repassait privé → l'étape « Auth »
  #      ci-dessous configure git pour les cloner ; OU
  #   2. garder ces dépôts PUBLICS (cas nominal — aucun secret nécessaire,
  #      l'étape Auth est alors un no-op).
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  PUBLIC_FEATURES: "wasm observability simd llm-ollama llm-claude-ureq"

jobs:
  check:
    name: build · test · clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain Rust stable (+ clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Cargo clone les deps git optionnelles (forge/octasoma/ccos/scirust) même
      # non activées, pour résoudre le graphe. Elles sont PUBLIQUES (org Memorithm)
      # → aucun secret requis en nominal. Filet de sécurité : si l'une repassait
      # privée, un PAT en lecture (secret `DEPS_TOKEN`) rétablit le fetch. No-op
      # quand le secret est absent : la CI reste verte tant que les dépôts sont
      # publics.
      - name: Auth deps git Memorithm (filet — si DEPS_TOKEN présent)
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          if [ -n "$DEPS_TOKEN" ]; then
            git config --global \
              url."https://x-access-token:${DEPS_TOKEN}@github.com/Memorithm/".insteadOf \
              "https://github.com/Memorithm/"
            echo "auth Memorithm configurée (fetch privé activé)"
          else
            echo "DEPS_TOKEN absent — les dépôts Memorithm sont publics (nominal)"
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # --- Défaut (cœur sans dépendance de compilation) -------------------- #
      # NB : `--locked` fige le Cargo.lock mais NE dispense PAS de cloner les
      # git-deps optionnelles (cargo lit leur manifeste pour résoudre le graphe).
      - name: Clippy (défaut) — 0 warning
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests (défaut, + doctests)
        run: cargo test --locked

      # --- Toutes les features publiques ----------------------------------- #
      - name: Clippy (features publiques) — 0 warning
        run: cargo clippy --all-targets --locked --features "$PUBLIC_FEATURES" -- -D warnings

      - name: Tests (features publiques)
        run: cargo test --locked --features "$PUBLIC_FEATURES"
