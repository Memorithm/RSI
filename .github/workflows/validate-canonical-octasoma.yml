name: Validate canonical OctaSoma integration

on:
  push:
    branches: [arch/canonical-octasoma-v05]

permissions:
  contents: write

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: arch/canonical-octasoma-v05
          fetch-depth: 0
      - name: Install MSRV
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy
      - name: Apply strict-Clippy cleanup and resolve canonical memory graph
        shell: bash
        run: |
          set -euo pipefail
          final='145761aeb52ef8ded85dcf2b8c97690005284926'
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/web_crawl.rs")
          s = p.read_text()
          old = '''            } else {\n                if in_script == 0 && in_style == 0 {\n                    text.push(c);\n                }\n            }'''
          new = '''            } else if in_script == 0 && in_style == 0 {\n                text.push(c);\n            }'''
          if s.count(old) != 1:
              raise SystemExit(f"expected one collapsible else-if block, found {s.count(old)}")
          p.write_text(s.replace(old, new))
          PY
          test ! -e octasoma/Cargo.toml
          cargo +1.89.0 check
          cargo +1.89.0 check --features octasoma
          cargo +1.89.0 test --features octasoma
          cargo +1.89.0 clippy --all-targets --features octasoma -- -D warnings
          grep -Fq "$final" Cargo.lock || { echo 'canonical OctaSoma revision missing from lock' >&2; exit 1; }
          count="$(grep -c '^name = "octasoma"$' Cargo.lock)"
          test "$count" -eq 1 || { echo "expected one OctaSoma package, found $count" >&2; exit 1; }
      - name: Commit validated source, lock and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/validate-canonical-octasoma.yml
          git config user.name 'ZEKRITI Tarek'
          git config user.email 'contact@checkupauto.fr'
          git add src/web_crawl.rs Cargo.lock .github/workflows/validate-canonical-octasoma.yml
          git commit -m 'chore(memory): qualify canonical OctaSoma v0.5'
          git push origin HEAD:arch/canonical-octasoma-v05
