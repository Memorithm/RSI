name: CI

# Build + tests + clippy à chaque push sur main et chaque pull request.
# Le seuil dur du dépôt est clippy 0 warning + tests verts. P1.2 ajoute le
# moteur canonique SciRust à la matrice publique ; le lockfile reste immuable.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  PUBLIC_FEATURES: "wasm observability simd llm-ollama llm-claude-ureq scirust"

jobs:
  check:
    name: build · test · clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain Rust stable (+ clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # `scirust-rsi` est une dépendance git publique, épinglée sur une révision
      # SciRust immuable. Ce filet permet seulement le fetch si le dépôt devenait
      # privé ; il ne transforme jamais le pin en branche mobile.
      - name: Auth deps git Memorithm (filet — si DEPS_TOKEN présent)
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          if [ -n "$DEPS_TOKEN" ]; then
            git config --global \
              url."https://x-access-token:${DEPS_TOKEN}@github.com/Memorithm/".insteadOf \
              "https://github.com/Memorithm/"
            echo "auth Memorithm configurée (fetch privé activé)"
          else
            echo "DEPS_TOKEN absent — dépôt SciRust public (nominal)"
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (défaut) — 0 warning
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests (défaut, + doctests)
        run: cargo test --locked

      - name: Clippy (features publiques) — 0 warning
        run: cargo clippy --all-targets --locked --features "$PUBLIC_FEATURES" -- -D warnings

      - name: Tests (features publiques)
        run: cargo test --locked --features "$PUBLIC_FEATURES"
