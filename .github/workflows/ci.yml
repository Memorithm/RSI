name: CI

# Build + tests + clippy à chaque push sur main et chaque pull request.
# Garde-fou anti-régression : le seuil de qualité est clippy 0 warning.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# annule les runs obsolètes d'une même branche/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# lecture seule : aucun scope d'écriture nécessaire (m23)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Les dépendances git Memorithm (`scirust-rsi`, `octasoma`) sont épinglées à
  # des révisions immuables et leurs bridges font partie des features qualifiées
  # à chaque PR.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  PUBLIC_FEATURES: "wasm observability simd llm-ollama llm-claude-ureq scirust octasoma"

jobs:
  check:
    name: build · test · clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain Rust stable (+ clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Auth deps git Memorithm (filet — si DEPS_TOKEN présent)
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          if [ -n "$DEPS_TOKEN" ]; then
            # --local (audit a20) : la config reste confinée au checkout ;
            # le token doit couvrir tous les dépôts Memorithm consommés
            # (octasoma, scirust) en lecture seule.
            git config --local \
              url."https://x-access-token:${DEPS_TOKEN}@github.com/Memorithm/".insteadOf \
              "https://github.com/Memorithm/"
            echo "auth Memorithm configurée (fetch privé activé)"
          else
            echo "DEPS_TOKEN absent — les dépôts Memorithm sont publics (nominal)"
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy (défaut) — 0 warning
        run: cargo clippy --all-targets --locked -- -D warnings

      # --workspace : les crates membres (forge/ccos/cogno-*) portent ~85 tests
      # qui n'étaient JAMAIS exécutés par un `cargo test` racine seul (M7).
      - name: Tests (workspace, défaut, + doctests)
        run: cargo test --locked --workspace

      # Inclut les bridges SciRust et OctaSoma contre leurs révisions canoniques
      # exactes enregistrées dans Cargo.toml/Cargo.lock.
      - name: Clippy (features publiques) — 0 warning
        run: cargo clippy --all-targets --locked --features "$PUBLIC_FEATURES" -- -D warnings

      - name: Tests (workspace, features publiques)
        run: cargo test --locked --workspace --features "$PUBLIC_FEATURES"

      # Toutes features confondues : la combinaison maximale n'était jamais
      # lintée (2 warnings y ont déjà échappé).
      - name: Clippy (toutes features) — 0 warning
        run: cargo clippy --workspace --all-targets --locked --all-features -- -D warnings

      # Le comportement derrière web/forge/ccos/simd/… n'était que linté :
      # désormais exécuté aussi (M7).
      - name: Tests (workspace, toutes features)
        run: cargo test --locked --workspace --all-features

      # MSRV déclaré = 1.89 (audit a16) : vérifié au moins en `check` pour le
      # workspace entier — une dépendance ou un idiome plus récent échoue ici.
      - name: MSRV 1.89 — check
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check --locked --workspace --all-features

  # C1 (suivi) : le build Docker a déjà cassé une fois sans que personne ne
  # le voie — un smoke par PR le rend impossible à rater. Build seul (pas de
  # run) : le binaire MCP est exercé partout ailleurs.
  docker-smoke:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image (musl statique)
        run: docker build -t rsi:smoke .
      - name: Sanity rsi-demo
        run: docker run --rm --entrypoint /usr/local/bin/rsi-demo rsi:smoke 2 7 random | tail -n 5

  # COG-RSI-003 : preuve d'exécution du confinement, au-delà de l'inspection
  # statique des arguments. Le candidat ne voit ni secret hôte, ni route réseau,
  # ni /etc ; Bubblewrap, prlimit ou cgroup v2 absents font échouer ce job.
  cargo-sandbox-smoke:
    name: cargo sandbox · no host secret/network
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Bubblewrap backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap util-linux
          # Ubuntu 24.04 restreint par défaut les user namespaces non privilégiés
          # via AppArmor. Le runner est jetable ; on active la capacité requise
          # pour qualifier le vrai backend au lieu de remplacer le test par un mock.
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Delegate aggregate cgroup v2 budgets
        run: |
          test -f /sys/fs/cgroup/cgroup.controllers
          for controller in memory pids cpu; do
            grep -qw "$controller" /sys/fs/cgroup/cgroup.controllers
            if ! grep -qw "$controller" /sys/fs/cgroup/cgroup.subtree_control; then
              echo "+$controller" | sudo tee /sys/fs/cgroup/cgroup.subtree_control
            fi
          done
          sudo mkdir /sys/fs/cgroup/rsi-ci
          sudo chown "$USER:$(id -gn)" \
            /sys/fs/cgroup/rsi-ci \
            /sys/fs/cgroup/rsi-ci/cgroup.procs \
            /sys/fs/cgroup/rsi-ci/cgroup.subtree_control
          for controller in memory pids cpu; do
            echo "+$controller" >> /sys/fs/cgroup/rsi-ci/cgroup.subtree_control
          done
      - name: Execute isolated CargoEvaluator probe
        env:
          RSI_TEST_BWRAP: "1"
          RSI_CGROUP_ROOT: /sys/fs/cgroup/rsi-ci
        run: cargo test --locked --lib isolated_cargo_sandbox_runtime_smoke

  # COG-RSI-001 : le wrapper de laboratoire conserve l'emprunt exclusif du
  # tampon KV, reste !Send + !Sync et ne déréférence aucun handle tant que le
  # backend réel n'est pas qualifié. Miri exerce cette frontière sans fabriquer
  # de pointeur invalide ni appeler llama.cpp.
  miri-ffi-wrapper:
    name: miri · FFI lab wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned nightly with Miri
        run: rustup toolchain install nightly-2026-07-02 --profile minimal --component miri

      - name: Qualify the safe FFI lab boundary under Miri
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: >-
          cargo +nightly-2026-07-02 miri test --locked --lib
          llama_ffi_lab_client_fails_closed_without_touching_memory
