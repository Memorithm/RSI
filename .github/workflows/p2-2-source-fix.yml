name: P2.2 source correction
on:
  push:
    branches: [rsi/p2-2-patchset-envelope-trajectories]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rsi/p2-2-patchset-envelope-trajectories
      - name: Correct source and retire bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/engineering_proposal.rs')
          s = p.read_text()
          old = 'assert!(matches!(err, ProposalError::PathNotAllowed(_));'
          new = 'assert!(matches!(err, ProposalError::PathNotAllowed(_)));'
          if s.count(old) != 1:
              raise SystemExit('expected source marker not found exactly once')
          p.write_text(s.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p2-2-source-fix.yml
          git add src/engineering_proposal.rs
          git diff --cached --check
          git commit -m "fix: close P2.2 allowlist assertion"
          git push origin HEAD:rsi/p2-2-patchset-envelope-trajectories
