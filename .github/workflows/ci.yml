name: CI

# Build + tests + clippy à chaque push sur main et chaque pull request.
# Garde-fou anti-régression : le seuil de qualité est clippy 0 warning.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# annule les runs obsolètes d'une même branche/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Cargo résout également les dépendances git optionnelles. `scirust-rsi` est
  # volontairement épinglé sur une révision immuable de Memorithm/scirust et
  # fait partie des features qualifiées à chaque PR depuis P1.2.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  PUBLIC_FEATURES: "wasm observability simd llm-ollama llm-claude-ureq scirust"

jobs:
  check:
    name: build · test · clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain Rust stable (+ clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Auth deps git Memorithm (filet — si DEPS_TOKEN présent)
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          if [ -n "$DEPS_TOKEN" ]; then
            git config --global \
              url."https://x-access-token:${DEPS_TOKEN}@github.com/Memorithm/".insteadOf \
              "https://github.com/Memorithm/"
            echo "auth Memorithm configurée (fetch privé activé)"
          else
            echo "DEPS_TOKEN absent — les dépôts Memorithm sont publics (nominal)"
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (défaut) — 0 warning
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests (défaut, + doctests)
        run: cargo test --locked

      # Inclut `scirust`: ceci compile et teste le bridge contre la révision
      # canonique exacte enregistrée dans Cargo.toml/Cargo.lock.
      - name: Clippy (features publiques) — 0 warning
        run: cargo clippy --all-targets --locked --features "$PUBLIC_FEATURES" -- -D warnings

      - name: Tests (features publiques)
        run: cargo test --locked --features "$PUBLIC_FEATURES"

      # Toutes features confondues : la combinaison maximale n'était jamais
      # lintée (2 warnings y ont déjà échappé).
      - name: Clippy (toutes features) — 0 warning
        run: cargo clippy --workspace --all-targets --locked --all-features -- -D warnings
